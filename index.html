<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>GRID DODGE</title>
  <link rel="icon" href="data:,">
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; background: #0a0810; color: #e8dccb; font-family: system-ui, sans-serif; overflow: hidden; }
    /* 列は minmax(0, 1fr)。こうしないと、中身が広い時に列が画面の幅より広がる */
    #app { position: fixed; inset: 0; display: grid; grid-template-rows: auto 1fr; grid-template-columns: minmax(0, 1fr); }
    #hud { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 8px 12px; font-size: 15px; font-variant-numeric: tabular-nums; }
    #mute { background: #2a2018; color: inherit; border: 1px solid #6a5238; border-radius: 6px; padding: 4px 10px; cursor: pointer; }
    /* stage は canvas の大きさに左右されない寸法を持つ。フリックは stage 全体で受けるので、ブラウザの操作を止める */
    #stage { position: relative; min-height: 0; overflow: hidden; touch-action: none; user-select: none; -webkit-user-select: none; }
    #game { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
    #flash { position: absolute; inset: 0; pointer-events: none; opacity: 0; }
    #pops { position: absolute; inset: 0; pointer-events: none; }
    .pop { position: absolute; transform: translate(-50%, -50%); font-weight: 800; font-size: 22px; color: #fff; white-space: nowrap;
      text-shadow: 0 0 10px #7fe8ff, 0 0 2px #000; animation: pop 0.8s ease-out forwards; }
    @keyframes pop { from { opacity: 1; margin-top: 0; } to { opacity: 0; margin-top: -60px; } }
    .screen { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px;
      background: radial-gradient(ellipse at center, rgba(10, 8, 16, 0.6), rgba(10, 8, 16, 0.9)); pointer-events: none; text-align: center; padding: 16px; }
    .screen[hidden] { display: none; }
    .screen h1 { margin: 0 0 8px; font-size: clamp(40px, 11vw, 72px); letter-spacing: 0.04em; color: #fff3e0; text-shadow: 0 0 24px #ff8a3d; }
    .screen h2 { margin: 0; font-size: clamp(32px, 9vw, 56px); color: #ff7043; }
    .screen p { margin: 0; font-size: clamp(15px, 4vw, 20px); color: #cbb9a3; }
    .screen .big { font-size: clamp(40px, 12vw, 68px); font-weight: 800; color: #fff; font-variant-numeric: tabular-nums; }
    .screen .best { color: #7fe8ff; font-weight: 700; }
    .screen .go { margin-top: 18px; font-size: clamp(20px, 5.5vw, 28px); font-weight: 700; color: #ffc46b; animation: blink 1.4s ease-in-out infinite; }
    @keyframes blink { 50% { opacity: 0.45; } }
  </style>
</head>
<body>
  <div id="app">
    <div id="hud"><span id="status"></span><button id="mute" type="button"></button></div>
    <div id="stage">
      <canvas id="game"></canvas>
      <div id="flash"></div>
      <div id="pops"></div>
      <div id="title-screen" class="screen">
        <h1>GRID DODGE</h1>
        <p>縦穴を落ちながら、赤く光ったマスから逃げる</p>
        <p>フリック / 矢印キーで1マス動く</p>
        <p>ぎりぎりで避けると、さらに深く落ちられる</p>
        <div class="go">タップでスタート</div>
      </div>
      <div id="over-screen" class="screen" hidden>
        <h2>ぶつかった</h2>
        <div class="big" id="over-depth"></div>
        <p id="over-grazes"></p>
        <p id="over-best"></p>
        <div class="go">タップでもう一度</div>
      </div>
    </div>
  </div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
