<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>GRID DODGE LAB</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;700&family=Zen+Kaku+Gothic+New:wght@400;700&display=swap">
<style>
/* 1画面のゲーム：上に計器、真ん中に試験区画、下に操作の説明。暗い実験場で決め打ち（片方のテーマだけ） */
:root{
  --bg:#06090f; --ink:#d8ecf5; --dim:#6f8fa3; --accent:#4fd8ff; --panel:#0b121c; --edge:#1d3242; --exit:#7dffd8; --b2:#f4f1ff;
  --f-num:"Chakra Petch","Segoe UI",system-ui,sans-serif;
  --f-jp:"Zen Kaku Gothic New","Hiragino Sans","Yu Gothic",system-ui,sans-serif;
  color-scheme:dark;
}
html,body{height:100%;margin:0}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font:14px var(--f-jp);overflow:hidden;
  -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;touch-action:none}
#app{touch-action:none;height:100vh;height:100dvh;display:flex;flex-direction:column;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
#hud{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);align-items:center;gap:8px;padding-block:10px 4px}
#hud .l{min-width:0}
#room{font-size:12px;color:var(--dim);letter-spacing:.06em}
#shape{font-size:14px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#mid{text-align:center}
#midLabel{font-size:11px;color:var(--dim);letter-spacing:.06em}
#time{font-family:var(--f-num);font-weight:700;font-size:30px;font-variant-numeric:tabular-nums;line-height:1}
#time.open{color:var(--exit)}
#hud .r{min-width:0;justify-self:end;display:flex;flex-direction:column;align-items:flex-end;gap:4px}
#modeTag{font-size:12px;color:var(--accent);white-space:nowrap}
.icon{background:none;border:1px solid var(--edge);color:var(--dim);border-radius:6px;font:12px var(--f-jp);padding:4px 8px;cursor:pointer}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
#stage{flex:1;position:relative;min-height:0}
#cv{position:absolute;inset:0;display:block;width:100%;height:100%}
#banner{position:absolute;left:0;right:0;top:6px;display:flex;justify-content:center;pointer-events:none}
#banner div{background:rgba(8,16,26,.9);border:1px solid var(--edge);border-left:3px solid var(--accent);padding:8px 14px;border-radius:4px;max-width:92%;transition:opacity .25s,transform .25s}
#banner b{display:block;font-size:15px}
#banner span{font-size:12px;color:var(--dim)}
#banner .off{opacity:0;transform:translateY(-6px)}
#foot{font-size:12px;color:var(--dim);text-align:center;padding-block:4px 12px;min-height:2.6em}
.ov{position:fixed;inset:0;background:rgba(4,7,12,.84);display:flex;align-items:flex-start;justify-content:center;overflow:auto;
  padding:max(24px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) 24px max(16px,env(safe-area-inset-left,0px))}
.card{width:100%;max-width:440px;background:var(--panel);border:1px solid var(--edge);border-radius:10px;padding:20px 18px;display:flex;flex-direction:column;gap:14px;margin-block:auto}
h1{margin:0;font-family:var(--f-num);font-size:30px;letter-spacing:.04em;line-height:1}
h1 span{color:var(--accent)}
.lead{margin:6px 0 0;font-size:13px;color:var(--dim);line-height:1.7}
#result{border:1px solid var(--edge);border-radius:8px;padding:12px 14px;display:flex;flex-direction:column;gap:4px}
#result .big{font-family:var(--f-num);font-size:28px;font-weight:700;font-variant-numeric:tabular-nums}
#result .sub{font-size:12px;color:var(--dim);line-height:1.6}
.modeBtn{text-align:left;background:#0f1a26;color:var(--ink);border:1px solid var(--edge);border-left:3px solid var(--accent);border-radius:8px;padding:12px 14px;cursor:pointer;display:flex;flex-direction:column;gap:4px;font-family:var(--f-jp)}
.modeBtn b{font-size:16px}
.modeBtn span{font-size:12px;color:var(--dim);line-height:1.6}
.modeBtn small{font-family:var(--f-num);font-size:11px;color:var(--accent)}
.modeBtn:active{border-color:var(--accent)}
.sec{display:flex;flex-direction:column;gap:10px}
.sec h2{margin:0;font-size:16px}
.sec h2 small{font-size:12px;color:var(--dim);font-weight:400;margin-left:6px}
#stages{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:8px}
.stg{background:#0f1a26;color:var(--ink);border:1px solid var(--edge);border-radius:8px;padding:8px 6px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;font-family:var(--f-jp);min-height:64px}
.stg b{font-family:var(--f-num);font-size:18px;line-height:1.1}
.stg span{font-size:11px;color:var(--dim);text-align:center;line-height:1.3}
.stg.done{border-color:var(--exit)}
.stg.done b::after{content:" \2713";color:var(--exit);font-size:13px}
.stg:active{border-color:var(--accent)}
.toggle{display:flex;gap:10px;align-items:flex-start;font-size:13px;line-height:1.6;cursor:pointer}
.toggle input{margin-top:4px;width:18px;height:18px;accent-color:var(--accent);flex:none}
.toggle span small{display:block;font-size:12px;color:var(--dim)}
details{font-size:12px;color:var(--dim)}
details summary{cursor:pointer}
details ul{margin:6px 0 0;padding-left:1.2em;line-height:1.7}
@media (prefers-reduced-motion:reduce){#banner div{transition:none}}
</style>
</head>
<body>
<div id="app">
  <div id="hud">
    <div class="l"><div id="room">区画 —</div><div id="shape">待機中</div></div>
    <div id="mid"><div id="midLabel">—</div><div id="time">—</div></div>
    <div class="r"><div id="modeTag"></div><button class="icon" id="mute" aria-label="音の入り切り">音 入</button></div>
  </div>
  <div id="stage"><canvas id="cv"></canvas><div id="banner"><div class="off"><b></b><span></span></div></div></div>
  <div id="foot">（試作 v14）</div>
</div>

<div class="ov" id="ovStart">
  <div class="card">
    <div id="result" hidden>
      <div class="sub" id="rHead">ラン終了</div>
      <div class="big" id="rMain"></div>
      <div class="sub" id="rSub"></div>
    </div>
    <div>
      <h1>GRID DODGE <span>LAB</span></h1>
      <p class="lead">被験体のロボットで、試験区画を1つずつ抜けていく。区画の形は毎回ちがう。当たったら最初から。</p>
    </div>
    <div class="sec">
      <h2>逃げながら塗る<small>ステージを選ぶ</small></h2>
      <p class="lead" style="margin:0">通ったマスが塗られる。目標のマス数を塗ればステージ突破で、次のステージへ続く。</p>
      <div id="stages"></div>
    </div>
    <button class="modeBtn" data-mode="duo"><small>案 1</small><b>二体同時の試験</b><span>ロボットが2体。画面の左半分のフリックで L、右半分で R が動く（キーは WASD と矢印）。しばらく生き延びると出口が2つ開き、L と R がそれぞれの出口に同時に乗れば突破。</span></button>
    <details><summary>障害と柱の見分け方</summary><ul id="legend"></ul></details>
    <p class="lead" id="bestNote"></p>
  </div>
</div>

<script>
(()=>{
const TYPES=[
 {id:'laser', name:'レーザー',     color:'#ff4d6d', desc:'1列を一瞬撃つ。細い線が伸び切ったら発射。柱で止まる'},
 {id:'orb',   name:'エネルギー球', color:'#ff5ad1', desc:'1列をゆっくり転がる。当たるのは球のいるマスだけ。柱で壊れる'},
 {id:'beam',  name:'持続ビーム',   color:'#b57bff', desc:'1列を数秒ふさぐ。その間は入れない。柱で止まる'},
 {id:'panel', name:'封鎖パネル',   color:'#ff9440', desc:'角の枠が閉じると床が熱くなり、数秒入れない'},
 {id:'sweep', name:'掃引レーザー', color:'#ff4d6d', desc:'番号の順に1列ずつ撃つ。撃ち終わった列へ逃げる'},
 {id:'drone', name:'照準ドローン', color:'#ffd43b', desc:'照準がロボットを追い、止まってから撃つ。止まったら外す'},
 {id:'pulse', name:'パルス',       color:'#7dff9a', desc:'中心から輪が外へ広がる。撃ち終わった内側へ戻る'},
];
const TMAP=Object.fromEntries(TYPES.map(t=>[t.id,t]));
const MODES={duo:{name:'二体同時',foot:'左半分のフリックで L、右半分で R（指を離して次へ）／ キーは WASD と矢印'},
             paint:{name:'逃げながら塗る',foot:'フリックで1マス（指を離して次へ・両手で可）／ キーは矢印・WASD'}};
const BOTC=['#4fd8ff','#f4f1ff'], BOTN=['L','R'];
const $=s=>document.querySelector(s);
const cv=$('#cv'),ctx=cv.getContext('2d'),stage=$('#stage');
$('#legend').innerHTML=TYPES.map(t=>`<li><b style="color:${t.color}">${t.name}</b>：${t.desc}</li>`).join('')+
  '<li><b style="color:#9fb8c8">柱</b>：入れない。レーザー・球・ビームを止めるので、陰に隠れられる</li>';

let MODE='duo';
const bestKey=m=>'gdlab-best-'+m;
function getBest(m){try{return +localStorage.getItem(bestKey(m))||0;}catch(e){return 0;}}
function setBest(m,v){try{localStorage.setItem(bestKey(m),String(v));}catch(e){}}
function showBest(){const a=getBest('duo'),b=getBest('paint');
  $('#bestNote').textContent=(a||b)?'これまでの最高：二体同時 区画 '+a+'　／　塗る 区画 '+b+'（突破した数）':'';}
showBest();
const STAGES=7;
function getCleared(){try{return new Set(JSON.parse(localStorage.getItem('gdlab-paint-cleared')||'[]'));}catch(e){return new Set();}}
function addCleared(k){const c=getCleared(); c.add(k); try{localStorage.setItem('gdlab-paint-cleared',JSON.stringify([...c]));}catch(e){}}
function renderStages(){const c=getCleared(); let h='';
  for(let k=1;k<=STAGES;k++){const n=Math.min(8,3+k), t=k===1?'レーザー・球':k>=TYPES.length?'全部の試験':TYPES[k].name;
    h+='<button class="stg'+(c.has(k)?' done':'')+'" data-stage="'+k+'"><b>'+k+'</b><span>'+n+'×'+n+'<br>'+t+'</span></button>';}
  $('#stages').innerHTML=h;}
renderStages();
let FLIP=false; // 撃たれたマスの色が反転するルール（v11 で試し、本人の判断で外した）

// ---- 音 ----
let AC=null,muted=false;
$('#mute').addEventListener('click',()=>{muted=!muted; $('#mute').textContent=muted?'音 切':'音 入';});
function beep(f,d,type,v,slide){ if(muted||!AC)return; const t=AC.currentTime,o=AC.createOscillator(),g=AC.createGain();
  o.type=type||'square'; o.frequency.setValueAtTime(f,t); if(slide)o.frequency.exponentialRampToValueAtTime(slide,t+d);
  g.gain.setValueAtTime(v||.04,t); g.gain.exponentialRampToValueAtTime(.0001,t+d); o.connect(g).connect(AC.destination); o.start(t); o.stop(t+d+.02);}

// ---- 寸法 ----
let W=0,H=0,DPR=1,N=4,S=0,BX=0,BY=0,GAP=4,CS=0;
function layout(){const m=Math.max(44,Math.min(W,H)*.11); S=Math.max(120,Math.min(W-2*m,H-2*m)); BX=(W-S)/2; BY=(H-S)/2; GAP=Math.max(2,S*.012); CS=(S-GAP*(N-1))/N;}
function resize(){const r=stage.getBoundingClientRect(); DPR=Math.min(2,window.devicePixelRatio||1); W=r.width; H=r.height;
  cv.width=Math.round(W*DPR); cv.height=Math.round(H*DPR); layout();}
new ResizeObserver(resize).observe(stage);
const cx=x=>BX+x*(CS+GAP), cy=y=>BY+y*(CS+GAP);
const clamp=(v,a=0,b=1)=>Math.max(a,Math.min(b,v));
const lerp=(a,b,t)=>a+(b-a)*t;
const ri=n=>Math.floor(Math.random()*n);
const D4=[[1,0],[-1,0],[0,1],[0,-1]];

// ---- 区画の形 ----
// 0=穴（床が無い） 1=床 2=柱。型は使わず毎回ランダムに育て、行き止まり（床の隣が1つ以下）を削る
let M=[];
const at=(x,y)=>(x>=0&&y>=0&&x<N&&y<N)?M[y*N+x]:0;
const walk=(x,y)=>at(x,y)===1;
function floors(){const a=[];for(let y=0;y<N;y++)for(let x=0;x<N;x++)if(M[y*N+x]===1)a.push([x,y]);return a;}
function connected(m,n){let start=-1,cnt=0;for(let i=0;i<m.length;i++)if(m[i]===1){cnt++;if(start<0)start=i;}
  if(start<0)return false; const seen=new Set([start]),q=[start];
  while(q.length){const i=q.pop(),x=i%n,y=(i/n)|0; for(const [dx,dy] of D4){const nx=x+dx,ny=y+dy,j=ny*n+nx;
    if(nx>=0&&ny>=0&&nx<n&&ny<n&&m[j]===1&&!seen.has(j)){seen.add(j);q.push(j);}}}
  return seen.size===cnt;}
function nb(m,n,i){const x=i%n,y=(i/n)|0;let c=0;for(const [dx,dy] of D4){const nx=x+dx,ny=y+dy;if(nx>=0&&ny>=0&&nx<n&&ny<n&&m[ny*n+nx]===1)c++;}return c;}
function genRoom(k){
  const n=Math.min(8,3+k);
  for(let tries=0;tries<400;tries++){
    let m=new Array(n*n).fill(0);
    if(k===1)m.fill(1);
    else{
      const goal=Math.round(n*n*lerp(.5,.85,Math.random())), seeds=1+ri(3); let cnt=0;
      for(let s=0;s<seeds;s++){const i=ri(n*n); if(!m[i]){m[i]=1;cnt++;}}
      for(let g=0;cnt<goal&&g<6000;g++){const fl=[];for(let i=0;i<m.length;i++)if(m[i]===1)fl.push(i);
        const i=fl[ri(fl.length)],x=i%n,y=(i/n)|0,[dx,dy]=D4[ri(4)],nx=x+dx,ny=y+dy;
        if(nx>=0&&ny>=0&&nx<n&&ny<n&&!m[ny*n+nx]){m[ny*n+nx]=1;cnt++;}}
      const pil=ri(Math.floor(n/2)+1);
      for(let p=0,g=0;p<pil&&g<60;g++){const i=ri(n*n); if(m[i]===1&&nb(m,n,i)>=3){m[i]=2;p++;}}
    }
    for(let ch=true;ch;){ch=false; for(let i=0;i<m.length;i++)if(m[i]===1&&nb(m,n,i)<2){m[i]=0;ch=true;}}
    for(let i=0;i<m.length;i++)if(m[i]===2&&nb(m,n,i)<2)m[i]=0; // 床から離れた柱は消す
    const fc=m.filter(v=>v===1).length;
    if(fc>=Math.max(9,n*n*.4)&&connected(m,n))return {n,m};
  }
  return {n,m:new Array(n*n).fill(1)};
}

// ---- 状態 ----
let G=null;
function startRun(mode,stage){
  if(mode)MODE=mode; stage=stage||1; 
  if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)();}catch(e){}} else if(AC.state==='suspended')AC.resume();
  G={room:0,totalT:0,state:'play',T:0,hz:[],gid:0,shake:0,flash:0,cause:null,erased:[],gained:[]};
  $('#ovStart').hidden=true; $('#result').hidden=false; $('#foot').textContent=MODES[MODE].foot+'　（試作 v14）';
  $('#modeTag').textContent=MODES[MODE].name+(MODE==='paint'&&FLIP?'・反転':''); G.startStage=stage; enterRoom(stage);
}
function nearest(fl,tx,ty,not){let best=null,bd=1e9;for(const f of fl){if(not&&f[0]===not[0]&&f[1]===not[1])continue;
  const d=Math.abs(f[0]-tx)+Math.abs(f[1]-ty)+Math.random()*.1; if(d<bd){bd=d;best=f;}}return best;}
function enterRoom(k){
  const r=genRoom(k); N=r.n; M=r.m; layout();
  const fl=floors(), c=(N-1)/2, bots=[];
  if(MODE==='duo'){const a=nearest(fl,c-1.5,c), b=nearest(fl,c+1.5,c,a); bots.push(mk(a),mk(b));}
  else bots.push(mk(nearest(fl,c,c)));
  function mk(p){return {x:p[0],y:p[1],tx:p[0],ty:p[1],fx:p[0],fy:p[1],mt:0,moving:false,q:null,vx:p[0],vy:p[1],bump:null};}
  Object.assign(G,{room:k,state:'play',T:0,hz:[],bots,exits:null,exitAt:Math.min(20,11+k*1.5),nextSpawn:.9,enter:1,erased:[],gained:[]});
  if(MODE==='paint'){const ratio=paintRatio(k); G.paint=new Map([[bots[0].x+','+bots[0].y,-1]]); G.lastPaint=-1; G.ratio=ratio; G.goal=Math.ceil(fl.length*ratio);}
  bannerQ.length=0; bannerT=0;
  if(MODE==='duo')banner('区画 '+k+'：'+N+'×'+N,'左手で L、右手で R。出口が開いたら、それぞれの出口へ');
  else banner('ステージ '+k+'：'+N+'×'+N,(G.goal>=fl.length?'床を全部（':'床の '+Math.round(G.ratio*100)+'%（')+G.goal+' マス）塗れば突破。撃たれた床は消える。熱い床は塗れない間、数に入れない');
  const t=TYPES[Math.min(TYPES.length-1,k)];
  if(k>1&&k<TYPES.length)banner('新しい試験：'+t.name,t.desc);
  beep(330,.3,'sine',.05,880);
}
function diff(){return clamp((MODE==='duo'?.08:.12)+(G.room-1)*(MODE==='duo'?.08:.1)+G.T/45);}
function warnTime(){return lerp(1.0,.5,diff())*(MODE==='duo'?1.15:1);}
function allowed(){return TYPES.slice(0,Math.min(TYPES.length,G.room+1)).map(t=>t.id);}
function active(h,t){return t>=h.tf&&t<h.te;}
const has=(cells,x,y)=>cells.some(c=>c[0]===x&&c[1]===y);
function blockedAt(x,y,t){return G.hz.some(h=>h.blocks&&active(h,t)&&has(h.cells,x,y));}
function canEnter(x,y,t){return walk(x,y)&&!blockedAt(x,y,t);}

// 塗る割合：区画 1 は 85%、区画ごとに 3% 増え、区画 6 から全部
function paintRatio(k){return Math.min(1,.85+(k-1)*.03);}
// 今の目標：熱い（封鎖・ビームの）間は塗れないマスを、目標から外す
function need(){const hot=new Set(); for(const h of G.hz)if(h.blocks&&active(h,G.T))for(const c of h.cells){const k=c[0]+','+c[1]; if(!G.paint.has(k))hot.add(k);}
  return Math.min(G.goal,floors().length-hot.size);}
// 判定はフリックした瞬間に次のマスへ移る。見た目だけ MOVE 秒かけて滑らせ、着いてからマスの色を変える
const MOVE=.11, PAINT_T=.2;
const posOf=b=>[b.x,b.y];
function tryMove(bi,dx,dy){
  if(!G||G.state!=='play')return false;
  const b=G.bots[bi]; if(!b)return false;
  const nx=b.x+dx,ny=b.y+dy, other=G.bots.some((o,i)=>i!==bi&&o.x===nx&&o.y===ny);
  if(!walk(nx,ny)||other){b.bump={dx,dy,t:G.T}; beep(140,.06,'square',.025); return false;}
  Object.assign(b,{fx:b.vx,fy:b.vy,x:nx,y:ny,mt:G.T,moving:true}); beep(bi?600:520+ri(60),.04,'triangle',.03);
  if(MODE==='paint'){const k=nx+','+ny; if(!G.paint.has(k)){G.paint.set(k,G.T+MOVE); G.lastPaint=G.T+MOVE; setTimeout(()=>beep(760+G.paint.size*8,.05,'sine',.025),MOVE*1000);}}
  return true;
}
function stepBots(T){
  for(const b of G.bots){
    if(!b.moving){b.vx=b.x; b.vy=b.y; continue;}
    const p=clamp((T-b.mt)/MOVE), e=1-(1-p)*(1-p);
    b.vx=lerp(b.fx,b.x,e); b.vy=lerp(b.fy,b.y,e); if(p>=1)b.moving=false;
  }
}

// ---- 障害 ----
// 線の通り道：発射口から順に。柱で止まる。穴は通り抜ける（当たる床が無い）
function travel(axis,idx,side){const p=[];let stop=false;
  for(let i=0;i<N;i++){const j=side?N-1-i:i, c=axis==='row'?[j,idx]:[idx,j]; if(at(c[0],c[1])===2){stop=true;break;} p.push(c);}
  return {path:p,stop};}
function lineOk(axis,idx,side){return travel(axis,idx,side).path.some(c=>walk(c[0],c[1]));}
// aim のとき、狙うロボットの行か列を必ず通る線にする
function pickLine(b,aim){
  for(let g=0;g<20;g++){const axis=Math.random()<.5?'row':'col', side=ri(2), idx=aim?(axis==='row'?b.y:b.x):ri(N);
    if(lineOk(axis,idx,side)&&(!aim||has(travel(axis,idx,side).path,b.x,b.y)))return {axis,idx,side};}
  return null;}
function mkLine(type,L,t0,tf,dur,extra){const tr=travel(L.axis,L.idx,L.side);

function randFloor(){const f=floors();return f[ri(f.length)];}
function build(type,bi,aim){
  const T=G.T,w=warnTime(),d=diff(),gid=++G.gid,[bx,by]=posOf(G.bots[bi]),b={x:bx,y:by};
  if(type==='laser'){const L=pickLine(b,aim); return L&&[mkLine('laser',L,T,T+w,.16,{gid})];}
  if(type==='orb'){const L=pickLine(b,aim); if(!L)return null; const per=lerp(.62,.34,d), tf=T+w*.9; const h=mkLine('orb',L,T,tf,0,{gid,per,blocks:false}); h.te=tf+(h.path.length+.7)*per; h.cells=[]; return [h];}
  if(type==='beam'){const L=pickLine(b,aim); return L&&[mkLine('beam',L,T,T+w*1.1,2.3+Math.random()*1.1,{gid})];}
  if(type==='panel'){

    if(MODE==='paint'){const pc=[...G.paint.keys()].map(q=>q.split(',').map(Number)).filter(c=>walk(c[0],c[1])&&!has(cells,c[0],c[1]))
      .map(c=>[c,Math.abs(c[0]-b.x)+Math.abs(c[1]-b.y)+Math.random()*1.5]).sort((p,q)=>p[1]-q[1]);
      for(const [c] of pc){if(cells.length>=k)break; cells.push(c);}}
    for(let g=0;cells.length<k&&g<20;g++){const c=randFloor(); if(!has(cells,c[0],c[1]))cells.push(c);}
    return [{type:'panel',cells,t0:T,tf:T+w*1.05,te:T+w*1.05+2.4+Math.random(),blocks:true,gid}];
  }
  if(type==='sweep'){

    for(let i=0;i<N;i++){const idx=dir>0?i:N-1-i; if(!lineOk(axis,idx,side))continue; out.push(mkLine('sweep',{axis,idx,side},T,T+w+o*iv,.16,{gid,order:o+1})); o++;}

    for(let r=0;r<N;r++){const cells=[];for(const f of floors())if(Math.max(Math.abs(f[0]-c[0]),Math.abs(f[1]-c[1]))===r)cells.push(f);
      if(cells.length) out.push({type:'pulse',cells,r,center:c,t0:T,tf:T+w+r*.3,te:T+w+r*.3+.15,blocks:false,gid});}

}
function orbU(h,t){return (t-h.tf)/h.per-.6;}
function orbCell(h,t){const k=Math.round(orbU(h,t)); if(k<0||k>=h.path.length)return null; const c=h.path[k]; return walk(c[0],c[1])?c:null;}
function cellsAt(h,t){if(h.type!=='orb')return h.cells; const c=orbCell(h,t); return c?[c]:[];}
function dangerSet(list,t){const s=new Set();for(const h of list)if(active(h,t))for(const c of cellsAt(h,t))s.add(c[0]+','+c[1]);return s;}
// どのロボットも、撃たれる前に安全なマスへ行けるときだけ出す
// 逃げ道の保証。人の速さ（見てから REACT 秒で動き出し、HMOVE 秒に 1 マス）で、
// 今ある障害と新しい障害が全部終わるまで、当たらずにいられる道が実際にあるかを、HSTEP 秒ごとに調べる
const HSTEP=.1, HMOVE=3, REACT=3;
function routeOk(list,bx,by,c0){
  const T0=G.T, end=Math.min(T0+6,Math.max(T0+.5,...list.map(h=>h.te)));
  const nS=Math.ceil((end-T0)/HSTEP);
  // まだ止まっていないドローンは、止まった時にいたマスを撃つ。道ごとに「止まった時のマス」を覚えて調べる
  const dr=list.find(h=>h.type==='drone'&&T0<h.tl), rest=dr?list.filter(h=>h!==dr):list;
  const US=[-.03,0,.035,.07,HSTEP+.01]; // そのマスにいる間（動く時刻の少しのずれも含む）
  let st=new Map([[bx+','+by+'|',c0===undefined?REACT:c0]]);
  for(let s=0;s<=nS;s++){
    const t=T0+s*HSTEP, ds=new Set(); for(const u of US)for(const k of dangerSet(rest,t+u))ds.add(k); // そのマスにいる次の刻みまでの間ずっと
    const drHot=dr&&US.some(u=>t+u>=dr.tf&&t+u<dr.te), lockNow=dr&&t>=dr.tl;
    const nx=new Map();
    const put=(x,y,c,lock)=>{const k=x+','+y; if(ds.has(k))return; if(lockNow&&!lock)lock=k; if(drHot&&lock===k)return;
      const key=k+'|'+(lock||''), o=nx.get(key); if(o===undefined||c<o)nx.set(key,c);};
    for(const [key,c] of st){const [k,lock]=key.split('|'), [x,y]=k.split(',').map(Number);
      if(s===0){put(x,y,c,lock); continue;}
      put(x,y,Math.max(0,c-1),lock);
      if(c===0)for(const [dx,dy] of D4){const ax=x+dx,ay=y+dy; if(walk(ax,ay))put(ax,ay,HMOVE-1,lock);}}

}
function fair(cands){
  const all=G.hz.concat(cands), needBlock=cands.some(c=>c.blocks), fc=floors().length, nb=G.bots.length;
  const times=[]; for(const c of cands){times.push(c.tf+.02); if(c.blocks)times.push((c.tf+c.te)/2,c.te-.03); if(c.type==='orb')for(let k=0;k<c.path.length;k++)times.push(c.tf+c.per*(k+.6));}
  for(const t of times){const ds=dangerSet(all,t); if(fc-ds.size<(needBlock?2:1)+nb)return false;}
  for(const b of G.bots)if(!routeOk(all,b.x,b.y))return false;
  return true;
}
// 出す障害を選ぶ。新しい試験を多めに出す。塗る方では球を少なくし、同時に出る数も絞る（球は通った列の色を順に消し、重いので）
function pickType(al,T){
  const paint=MODE==='paint', orbCap=N>=5?2:1, orbs=G.hz.filter(h=>h.type==='orb'&&h.te>T).length;
  const drones=G.hz.some(h=>h.type==='drone'&&h.te>T);
  const ok=al.filter(id=>!(paint&&id==='orb'&&orbs>=orbCap)&&!(id==='drone'&&drones));
  const newest=al[al.length-1];
  if(G.room<TYPES.length&&ok.includes(newest)&&Math.random()<(paint?.3:.4))return newest;
  const wt=id=>paint&&id==='orb'?.75:1, sum=ok.reduce((a,id)=>a+wt(id),0); let r=Math.random()*sum;
  for(const id of ok){r-=wt(id); if(r<=0)return id;} return ok[ok.length-1];
}
function spawn(){
  const T=G.T,d=diff();
  if(T<G.nextSpawn)return;
  const live=new Set(G.hz.filter(h=>h.te>T).map(h=>h.gid)).size;
  const maxC=(d<.3?1:d<.6?2:3)+(N>=7?1:0);
  if(live>=maxC){G.nextSpawn=T+.15;return;}
  const al=allowed(), type=pickType(al,T);
  const bi=ri(G.bots.length); let placed=false;

  for(let i=0;i<14&&!placed;i++){const c=build(type,bi,i<9); if(c&&c.length&&fair(c)){G.hz.push(...c); placed=true; beep(type==='drone'?880:330,.08,'sine',.03);}}

const bannerQ=[]; let bannerT=0;
function banner(b,s){bannerQ.push([b,s]);}
function tickBanner(dt){const el=$('#banner div');
  if(bannerT>0){bannerT-=dt; if(bannerT<=0)el.classList.add('off'); return;}

// ---- 進める ----
function distFrom(x0,y0){const dist=new Map([[x0+','+y0,0]]); let q=[[x0,y0]];
  while(q.length){const nq=[];for(const [x,y] of q)for(const [dx,dy] of D4){const nx=x+dx,ny=y+dy,k=nx+','+ny;
    if(walk(nx,ny)&&!dist.has(k)){dist.set(k,dist.get(x+','+y)+1);nq.push([nx,ny]);}} q=nq;}
  return dist;}
function openExits(){
  // それぞれのロボットから遠い床を、そのロボットの出口にする
  const ex=[];
  G.bots.forEach((b,i)=>{const arr=[...distFrom(b.x,b.y).entries()].filter(e=>!ex.some(x=>x.join(',')===e[0])&&!G.bots.some(o=>o.x+','+o.y===e[0]));
    const mx=Math.max(...arr.map(e=>e[1])), far=arr.filter(e=>e[1]>=Math.max(1,Math.ceil(mx*.6)));
    ex.push(far[ri(far.length)][0].split(',').map(Number));});
  G.exits=ex; banner('出口が開いた','L と R を、同じ印の出口へ。2体とも乗れば突破'); beep(660,.25,'sine',.05,1320);
}
function update(dt){
  if(!G)return;
  if(G.state==='dead')return;
  if(G.state==='clear'){G.clearT+=dt; if(G.clearT>1.0)enterRoom(G.room+1); return;}
  // 突破は決まった。ロボットが着いて色が変わるのを見せてから、突破の表示へ（この間は当たらない）
  if(G.state==='finish'){G.T+=dt; stepBots(G.T); if(G.T>=G.finishAt)clearRoom(); return;}
  G.T+=dt; G.totalT+=dt; const T=G.T;
  if(MODE==='duo'&&!G.exits&&T>=G.exitAt)openExits();
  for(const h of G.hz)if(h.type==='drone'){const b=G.bots[h.bot]; if(T<h.tl)h.cells=[[b.x,b.y]];
    const [x,y]=h.cells[0]; const k=1-Math.exp(-dt*(T<h.tl?7:30)); h.rx+=(cx(x)+CS/2-h.rx)*k; h.ry+=(cy(y)+CS/2-h.ry)*k;}
  for(const h of G.hz)if(!h.fired&&T>=h.tf){h.fired=true; if(h.type==='beam'||h.type==='panel')beep(110,.35,'sawtooth',.03,90); else if(h.type!=='orb')beep(1200,.12,'sawtooth',.025,300); else beep(200,.3,'triangle',.04,120);}
  // 撃たれた床は色が消える（パルスは範囲が広いので消さない）
  // 撃たれたマス：塗ってあれば消える。反転のルールでは、塗っていなければ塗られる（障害 1 つにつき 1 マス 1 回）
  if(MODE==='paint'){let gain=0; for(const h of G.hz)if(h.type!=='pulse'&&active(h,T)){h.flip=h.flip||new Set(); for(const c of cellsAt(h,T)){const k=c[0]+','+c[1]; if(h.flip.has(k))continue; h.flip.add(k);
    if(G.paint.has(k)){G.paint.delete(k); G.erased.push({x:c[0],y:c[1],t:T});} else if(FLIP){G.paint.set(k,T); G.lastPaint=T; G.gained.push({x:c[0],y:c[1],t:T}); gain++;}}}
    if(gain)beep(900+gain*40,.08,'sine',.03,1400);}
  G.gained=G.gained.filter(e=>T-e.t<.6);
  G.erased=G.erased.filter(e=>T-e.t<.6);
  stepBots(T);
  if(!G.god)for(let i=0;i<G.bots.length;i++){const b=G.bots[i]; for(const h of G.hz)if(active(h,T)&&has(cellsAt(h,T),b.x,b.y)){die(h,i);return;}}

  G.hz=G.hz.filter(h=>h.te>T-.35);
  spawn();
}
function clearRoom(){
  G.state='clear'; G.clearT=0; G.hz=[]; beep(523,.12,'sine',.05); setTimeout(()=>beep(784,.2,'sine',.05),120);
  if(G.room>getBest(MODE))setBest(MODE,G.room);

}

const FNUM=getComputedStyle(document.documentElement).getPropertyValue('--f-num'), FJP=getComputedStyle(document.documentElement).getPropertyValue('--f-jp');

function lineGeo(h){const c=(h.axis==='row'?cy(h.idx):cx(h.idx))+CS/2; const s=h.axis==='row'?BX:BY; return {c,s,e:s+S};}

}
function drawHazards(T){

          const o=(1-f)*CS*.45, L=CS*.22; ctx.strokeStyle=col; ctx.lineWidth=Math.max(2,CS*.05);
          for(const [sx,sy] of [[0,0],[1,0],[0,1],[1,1]]){const px=sx?X+CS+o:X-o, py=sy?Y+CS+o:Y-o, dx=sx?-1:1, dy=sy?-1:1;
            ctx.beginPath(); ctx.moveTo(px+dx*L,py); ctx.lineTo(px,py); ctx.lineTo(px,py+dy*L); ctx.stroke();}
        } else if(act){glow(col,18); ctx.fillStyle=col; ctx.globalAlpha=.75; rr(X,Y,CS,CS,4); ctx.fill(); ctx.shadowBlur=0; ctx.globalAlpha=1;
          hatch(X,Y,'#3a1300',.5); const r=clamp((h.te-T)/(h.te-h.tf)); ctx.fillStyle='#fff'; ctx.fillRect(X+5,Y+CS-7,(CS-10)*r,3);}
      }
    }
    if(h.type==='pulse'){
      if(T<h.tf){const [x,y]=h.center, r=h.r, soon=clamp(1-(h.tf-T)/1.0);
        ctx.fillStyle=col; ctx.globalAlpha=.1+.3*soon; for(const [a,b2] of h.cells){rr(cx(a),cy(b2),CS,CS,4); ctx.fill();}
        // 次に撃つ輪（同じパルスで一番早い未発射の輪）は実線の枠
        const next=!G.hz.some(o=>o.gid===h.gid&&o.type==='pulse'&&o.tf<h.tf&&T<o.te);
        if(next){ctx.strokeStyle=col; ctx.globalAlpha=.6+.4*soon; ctx.lineWidth=2.5; for(const [a,b2] of h.cells){rr(cx(a)+2,cy(b2)+2,CS-4,CS-4,4); ctx.stroke();}}
        ctx.globalAlpha=1;}
      if(false){
        for(const [x,y] of h.cells){rr(cx(x)+3,cy(y)+3,CS-6,CS-6,4); ctx.stroke();} ctx.setLineDash([]); ctx.globalAlpha=1;}
      if(act){glow(col,16); ctx.fillStyle=col; ctx.globalAlpha=.8; for(const [x,y] of h.cells){rr(cx(x),cy(y),CS,CS,4); ctx.fill();} ctx.shadowBlur=0; ctx.globalAlpha=1;}
    }
    if(h.type==='beam'&&act){for(const [x,y] of h.cells)hatch(cx(x),cy(y),col,.35);}
  }
  for(const h of G.hz){ if(h.type!=='orb')continue;
    const col=TMAP.orb.color, g=lineGeo(h), [ex,ey]=emitter(h,g);
    if(T<h.tf){const f=clamp((T-h.t0)/(h.tf-h.t0));
      ctx.fillStyle=col; ctx.globalAlpha=.75; h.path.forEach((c,i)=>{const [x,y]=pt(h,g,along(h,g,i)); ctx.beginPath(); ctx.arc(x,y,2.5,0,7); ctx.fill();});
      if(h.stop){const [x,y]=pt(h,g,lineEnd(h,g)); ctx.fillRect(x-3,y-3,6,6);}
      ctx.globalAlpha=1; glow(col,6+12*f); ctx.beginPath(); ctx.arc(ex,ey,CS*.1+CS*.12*f,0,7); ctx.fill(); ctx.shadowBlur=0; continue;}
    if(T>=h.te)continue;
    const u=orbU(h,T); if(h.stop&&u>h.path.length-.5){const [x,y]=pt(h,g,lineEnd(h,g)),q=clamp((u-h.path.length+.5)/1.2);
      ctx.strokeStyle=col; ctx.globalAlpha=1-q; ctx.lineWidth=3; ctx.beginPath(); ctx.arc(x,y,CS*.2+q*CS*.4,0,7); ctx.stroke(); ctx.globalAlpha=1; continue;}
    const c=orbCell(h,T); if(c){ctx.fillStyle=col; ctx.globalAlpha=.22; rr(cx(c[0]),cy(c[1]),CS,CS,4); ctx.fill(); ctx.globalAlpha=1;}
    for(let i=3;i>=0;i--){const [x,y]=pt(h,g,along(h,g,u-i*.18)); ctx.globalAlpha=i?.18/i:1; if(!i)glow(col,22); ctx.fillStyle=i?col:'#ffe6f7';
      ctx.beginPath(); ctx.arc(x,y,CS*.26*(1-i*.12),0,7); ctx.fill(); ctx.shadowBlur=0;}
    const [x,y]=pt(h,g,along(h,g,u)); ctx.globalAlpha=1; ctx.strokeStyle=col; ctx.lineWidth=3; ctx.beginPath(); ctx.arc(x,y,CS*.26,0,7); ctx.stroke();
  }
  for(const h of G.hz){
    if(h.type!=='laser'&&h.type!=='beam'&&h.type!=='sweep')continue;
    const col=TMAP[h.type].color, f=clamp((T-h.t0)/(h.tf-h.t0)), g=lineGeo(h), [ex,ey]=emitter(h,g), a0=h.side?g.e+16:g.s-16, a1=lineEnd(h,g);
    if(T<h.tf){
      ctx.fillStyle=col; ctx.globalAlpha=.12+.22*f; for(const c of h.cells){rr(cx(c[0]),cy(c[1]),CS,CS,4); ctx.fill();}
      ctx.globalAlpha=.9; band(h,g,a0,lerp(a0,a1,f),2);
      if(h.stop){const [x,y]=pt(h,g,a1); ctx.globalAlpha=.5; ctx.fillRect(x-4,y-4,8,8);}
      ctx.globalAlpha=1; glow(col,8+10*f); ctx.beginPath(); ctx.arc(ex,ey,3+4*f,0,7); ctx.fill(); ctx.shadowBlur=0;
      if(h.order){ctx.fillStyle='#fff'; ctx.font=NUMF(); ctx.textAlign='center'; ctx.textBaseline='middle'; if(h.axis==='row')ctx.fillText(h.order,ex,ey-12); else ctx.fillText(h.order,ex-12,ey);}
    } else if(T<h.te){
      const th=h.type==='beam'?CS*.62:CS*.42, fade=h.type==='beam'?clamp((h.te-T)/.4):1;
      glow(col,24); ctx.fillStyle=col; ctx.globalAlpha=.85*(.5+.5*fade); band(h,g,a0,a1,th*fade+2);
      ctx.shadowBlur=0; ctx.fillStyle='#fff'; ctx.globalAlpha=.9; band(h,g,a0,a1,Math.max(2,th*.22*fade));
      if(h.stop){const [x,y]=pt(h,g,a1); ctx.fillStyle=col; ctx.globalAlpha=.8; ctx.beginPath(); ctx.arc(x,y,CS*.14+Math.random()*3,0,7); ctx.fill();}
      ctx.globalAlpha=1;
    } else {ctx.fillStyle=col; ctx.globalAlpha=clamp(1-(T-h.te)/.35)*.4; band(h,g,a0,a1,3); ctx.globalAlpha=1;}
  }
  for(const h of G.hz){ if(h.type!=='drone')continue; const col=TMAP.drone.color;
    const lock=T>=h.tl, f=lock?clamp((T-h.tl)/(h.tf-h.tl)):0;
    if(active(h,T)){const [x,y]=h.cells[0]; glow(col,20); ctx.fillStyle=col; ctx.globalAlpha=.85; rr(cx(x),cy(y),CS,CS,4); ctx.fill(); ctx.shadowBlur=0; ctx.globalAlpha=1; continue;}
    if(T>=h.te)continue;
    const r=lock?lerp(CS*.62,CS*.26,f):CS*.55;
    ctx.save(); ctx.translate(h.rx,h.ry); ctx.rotate(lock?0:T*2.2); ctx.strokeStyle=lock?'#ffb02e':col; ctx.lineWidth=lock?3:2; glow(col,lock?14:6);
    ctx.setLineDash(lock?[]:[6,5]); ctx.beginPath(); ctx.arc(0,0,r,0,7); ctx.stroke(); ctx.setLineDash([]);
    for(let i=0;i<4;i++){ctx.rotate(Math.PI/2); ctx.beginPath(); ctx.moveTo(r-6,0); ctx.lineTo(r+8,0); ctx.stroke();}
    ctx.restore(); ctx.shadowBlur=0;
    if(lock){const [x,y]=h.cells[0]; ctx.fillStyle=col; ctx.globalAlpha=.12+.25*f; rr(cx(x),cy(y),CS,CS,4); ctx.fill(); ctx.globalAlpha=1;}
  }
}
// パルスの中心は、ロボットの上にも見えるように最後に描く
function drawPulseCenters(T){
  for(const h of G.hz){ if(h.type!=='pulse'||h.r!==0||T>=h.tf)continue;
    const col=TMAP.pulse.color, f=clamp((T-h.t0)/(h.tf-h.t0)), [x,y]=h.center, X=cx(x), Y=cy(y), mx=X+CS/2, my=Y+CS/2;
    glow(col,14); ctx.strokeStyle=col; ctx.lineWidth=4; rr(X-3,Y-3,CS+6,CS+6,6); ctx.stroke(); ctx.shadowBlur=0;
    const L=CS*.32; ctx.lineWidth=3; for(const [dx,dy] of D4){ctx.beginPath(); ctx.moveTo(mx+dx*(CS/2+4),my+dy*(CS/2+4)); ctx.lineTo(mx+dx*(CS/2+4+L),my+dy*(CS/2+4+L)); ctx.stroke();}
    const q=(T*1.5)%1; ctx.globalAlpha=1-q; ctx.lineWidth=2; const o=q*CS*.9; rr(X-3-o,Y-3-o,CS+6+2*o,CS+6+2*o,6); ctx.stroke(); ctx.globalAlpha=1;
    ctx.fillStyle=col; ctx.font='700 11px '+FJP; ctx.textAlign='center'; ctx.textBaseline='bottom'; ctx.fillText('パルス '+(h.tf-T).toFixed(1),mx,Y-6-L);}
}
function drawBots(T){
  G.bots.forEach((b,i)=>{
    let X=cx(b.vx)+CS/2, Y=cy(b.vy)+CS/2;
    if(b.bump){const t=(T-b.bump.t)/.12; if(t<1){const o=Math.sin(t*Math.PI)*CS*.08; X+=b.bump.dx*o; Y+=b.bump.dy*o;} else b.bump=null;}
    const r=CS*.27, dead=G.state==='dead'&&G.deadBot===i, col=dead?'#ff4d6d':BOTC[i];
    glow(BOTC[i],dead?0:18); ctx.fillStyle='#0b2533'; ctx.beginPath(); ctx.arc(X,Y,r,0,7); ctx.fill();
    ctx.lineWidth=3; ctx.strokeStyle=col; ctx.stroke(); ctx.shadowBlur=0;
    if(MODE==='duo'){ctx.fillStyle=col; ctx.textAlign='center'; ctx.textBaseline='middle'; ctx.font='700 '+Math.max(11,r*.95)+'px '+FNUM; ctx.fillText(BOTN[i],X,Y+1);}
    else{ctx.fillStyle=col; ctx.fillRect(X-r*.55,Y-r*.18,r*1.1,r*.36); ctx.fillStyle='#4fd8ff'; ctx.fillRect(X-r*.2+Math.sin(T*3)*r*.25,Y-r*.12,r*.4,r*.24);}
  });
}
function draw(){
  const T=G?G.T:0;
  ctx.setTransform(DPR,0,0,DPR,0,0); ctx.fillStyle='#06090f'; ctx.fillRect(0,0,W,H);
  ctx.strokeStyle='rgba(79,216,255,.05)'; ctx.lineWidth=1; const st=24;
  for(let x=(W/2)%st;x<W;x+=st){ctx.beginPath();ctx.moveTo(x+.5,0);ctx.lineTo(x+.5,H);ctx.stroke();}
  for(let y=(H/2)%st;y<H;y+=st){ctx.beginPath();ctx.moveTo(0,y+.5);ctx.lineTo(W,y+.5);ctx.stroke();}
  if(!G){M=new Array(16).fill(1); N=4; layout();}
  if(G&&MODE==='duo'){ // 左右の受け持ちの境目
    ctx.strokeStyle='rgba(216,236,245,.08)'; ctx.setLineDash([3,7]); ctx.beginPath(); ctx.moveTo(W/2+.5,0); ctx.lineTo(W/2+.5,H); ctx.stroke(); ctx.setLineDash([]);
    ctx.font='700 12px '+FNUM; ctx.textAlign='center'; ctx.textBaseline='bottom'; ctx.globalAlpha=.5;
    ctx.fillStyle=BOTC[0]; ctx.fillText('L',W*.25,H-4); ctx.fillStyle=BOTC[1]; ctx.fillText('R',W*.75,H-4); ctx.globalAlpha=1;}
  if(G&&G.shake>0)ctx.translate((Math.random()-.5)*12*G.shake,(Math.random()-.5)*12*G.shake);
  drawRoom(T);
  if(G){ if(G.state!=='clear')drawHazards(T); drawBots(T); if(G.state==='play')drawPulseCenters(T);
    if(G.flash>0){ctx.setTransform(DPR,0,0,DPR,0,0); ctx.fillStyle='rgba(255,77,109,'+(G.flash*.35)+')'; ctx.fillRect(0,0,W,H);}}
}
function hud(){
  if(!G)return;
  $('#room').textContent=(MODE==='paint'?'ステージ ':'区画 ')+G.room; $('#shape').textContent=N+'×'+N+'　床 '+floors().length;
  const t=$('#time'), L=$('#midLabel');
  if(G.state==='clear'){L.textContent='突破'; t.textContent='CLEAR'; t.className='open';}
  else if(MODE==='paint'){L.textContent='塗った床 ／ 目標'; const nd=need(); t.textContent=G.paint.size+'/'+nd; t.className=G.paint.size>=nd-2?'open':'';}
  else if(G.exits){L.textContent='出口が開いた'; t.textContent='L・R 出口へ'; t.className='open'; t.style.fontSize='22px';}
  else {L.textContent='出口が開くまで'; t.textContent=Math.max(0,G.exitAt-G.T).toFixed(1); t.className=''; t.style.fontSize='';}
}

let last=performance.now();
function frame(now){
  const dt=Math.min(.05,(now-last)/1000); last=now;
  update(dt); tickBanner(dt);
  if(G){G.shake=Math.max(0,G.shake-dt*2.5); G.flash=Math.max(0,G.flash-dt*2); G.enter=Math.max(0,G.enter-dt*1.4);}
  draw(); hud(); requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

// ---- 操作 ----
document.querySelectorAll('.modeBtn').forEach(b=>b.addEventListener('click',()=>startRun(b.dataset.mode)));
$('#stages').addEventListener('click',e=>{const b=e.target.closest('.stg'); if(b)startRun('paint',+b.dataset.stage);});
const K1={w:[0,-1],s:[0,1],a:[-1,0],d:[1,0]}, K2={ArrowUp:[0,-1],ArrowDown:[0,1],ArrowLeft:[-1,0],ArrowRight:[1,0]};
let lastKey=0;
window.addEventListener('keydown',e=>{
  if(!$('#ovStart').hidden)return;
  const key=e.key.length===1?e.key.toLowerCase():e.key; let bi=0,k=K1[key];
  if(!k){k=K2[key]; bi=MODE==='duo'?1:0;} if(!k)return; e.preventDefault();
  const now=performance.now(); if(e.repeat&&now-lastKey<95)return; lastKey=now; tryMove(bi,k[0],k[1]);
});
// 指ごとに覚える。どの指も1回のタッチで1マスだけ。二体同時では、触り始めた側（左右）でロボットが決まる
const touches=new Map(), app=$('#app');
app.addEventListener('pointerdown',e=>{
  if(!G||G.state!=='play'||e.target.closest('button'))return;
  e.preventDefault(); touches.set(e.pointerId,{x:e.clientX,y:e.clientY,used:false,bot:MODE==='duo'&&e.clientX>=window.innerWidth/2?1:0});
  try{app.setPointerCapture(e.pointerId);}catch(_){}
});
app.addEventListener('pointermove',e=>{
  const t=touches.get(e.pointerId); if(!t||t.used)return;
  const th=Math.max(14,Math.min(28,CS*.25)), dx=e.clientX-t.x, dy=e.clientY-t.y;
  if(Math.abs(dx)<th&&Math.abs(dy)<th)return;
  t.used=true; if(Math.abs(dx)>Math.abs(dy))tryMove(t.bot,Math.sign(dx),0); else tryMove(t.bot,0,Math.sign(dy));
});
function release(e){touches.delete(e.pointerId);}
app.addEventListener('pointerup',release); app.addEventListener('pointercancel',release);
// 試しの撮影用（画面には出ない）
window.__lab={get G(){return G;},enterRoom:k=>{G.state='play';enterRoom(k);},startRun,genRoom,tryMove,step:update,routeOk:(x,y,c)=>routeOk(G.hz,x,y,c),walk:(x,y)=>walk(x,y)};
})();
</script>
